name: Plugin Strict CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Dart Code Quality & Unit Tests
  code_analysis:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --fatal-infos

      - name: Run Dart Unit Tests (If available)
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "Test directory not found. Skipping unit tests."
          fi

  # 2. Android Strict Build Test
  android_build:
    name: Android Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Debug APK
        run: |
          cd example
          flutter pub get
          flutter build apk --debug

  # 3. iOS & Swift Package Manager Build Test
  ios_build:
    name: iOS & SPM Build Validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS No-Codesign
        run: |
          cd example
          flutter pub get
          flutter build ios --no-codesign
