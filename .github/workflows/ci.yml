name: Production Plugin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # 1. Code Diagnostics, Linter & Unit Tests
  code_analysis:
    name: Code Diagnostics & Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: |
          flutter analyze 2>&1 | tee analyze_output.log || true

      - name: Format Check
        run: |
          dart format --output=none --set-exit-if-changed . 2>&1 | tee format_output.log || true

      - name: Publish Diagnostics to Dashboard
        if: always()
        run: |
          echo "### 🔍 Dart Code Diagnostics & Warnings" >> $GITHUB_STEP_SUMMARY
          echo "<details open><summary><b>📋 Flutter Analyze & Linter Report</b></summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat analyze_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

  # 2. Android Build & Gradle Warnings
  android_build:
    name: Android Build & AGP Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          cd example
          flutter pub get
          flutter build apk --debug 2>&1 | tee android_build.log

      - name: Publish Android Warnings to Dashboard
        if: always()
        run: |
          echo "### 🤖 Android Build & Warnings Summary" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status == 'success' && '✅ PASSED' \vert{}\vert{} '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### ⚠️ Filtered Android / Gradle Warnings:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E -i 'warning|error|exception|note:' example/android_build.log || echo "No critical warnings found." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "<details><summary><b>📋 Click to view Full Android Build Log</b></summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 60 example/android_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

  # 3. iOS & SPM Validation & Warnings
  ios_build:
    name: iOS & SPM Build Validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS App
        run: |
          cd example
          flutter pub get
          flutter build ios --no-codesign 2>&1 | tee ios_build.log

      - name: Publish iOS & SPM Warnings to Dashboard
        if: always()
        run: |
          echo "### 🍏 iOS & Swift Package Manager Summary" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status == 'success' && '✅ PASSED' \vert{}\vert{} '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### ⚠️ Filtered iOS / SPM Notices & Warnings:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E -i 'warning|error|plugin|spm|package|dependency' example/ios_build.log || echo "No critical warnings found." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "<details><summary><b>📋 Click to view Full iOS Build Log</b></summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 60 example/ios_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
